<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reproductor Aleatorio YouTube Music</title>
</head>
<body>

  <h2>Reproductor de YouTube Music (IDs 100% Aleatorios)</h2>
  <div id="player"></div>

  <script>
    let player;

    // Función para generar un ID de YouTube completamente aleatorio de 11 caracteres
    function generateRandomVideoId() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-';
      let randomId = '';
      for (let i = 0; i < 11; i++) {
        const randomIndex = Math.floor(Math.random() * chars.length);
        randomId += chars[randomIndex];
      }
      return randomId;
    }

    // Cargar la API de YouTube Iframe asynchronously
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // Esta función se ejecuta automáticamente cuando la API está lista
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '360',
        width: '640',
        videoId: generateRandomVideoId(),
        playerVars: {
          'autoplay': 1,
          'playsinline': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      event.target.playVideo();
    }

    // Cuando termina un video, busca otro ID aleatorio
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        loadNextRandomVideo();
      }
    }

    // Como la gran mayoría de los IDs aleatorios no existirán (darán error 100 o 150),
    // el reproductor los saltará automáticamente en milisegundos hasta encontrar uno real.
    function onPlayerError(event) {
      console.warn("ID inválido (" + event.data + "). Intentando con otro ID aleatorio...");
      loadNextRandomVideo();
    }

    function loadNextRandomVideo() {
      const nextId = generateRandomVideoId();
      player.loadVideoById(nextId);
    }
  </script>

</body>
</html>
